services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiqms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiqms}
      POSTGRES_DB: ${POSTGRES_DB:-aiqms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiqms} -d ${POSTGRES_DB:-aiqms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aiqms:aiqms@db:5432/aiqms}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY for backend JWT signing}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      PHONE_NUMBER_ID: ${PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WHATSAPP_COPY_TEMPLATE: ${WHATSAPP_COPY_TEMPLATE:-}
      WHATSAPP_COPY_LANGUAGE: ${WHATSAPP_COPY_LANGUAGE:-}
      WHATSAPP_BOT_NUMBER: ${WHATSAPP_BOT_NUMBER:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_BOT_NUMBER:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  whatsapp-bot:
    build: ./whatsapp-bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      PHONE_NUMBER_ID: ${PHONE_NUMBER_ID}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v20.0}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000/api/v1}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3000"
    depends_on:
      - backend

  cv-service:
    profiles: [cv]
    build: ./cv-service
    restart: unless-stopped
    environment:
      CAMERA_SOURCE: ${CAMERA_SOURCE:-0}
      CAMERA_WIDTH: ${CAMERA_WIDTH:-640}
      CAMERA_HEIGHT: ${CAMERA_HEIGHT:-480}
      CAMERA_FPS: ${CAMERA_FPS:-15}
      YOLO_MODEL: ${YOLO_MODEL:-yolov8n.pt}
      YOLO_CONF_THRESHOLD: ${YOLO_CONF_THRESHOLD:-0.4}
      YOLO_IOU_THRESHOLD: ${YOLO_IOU_THRESHOLD:-0.5}
      YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
      ROI_CONFIG_PATH: ${ROI_CONFIG_PATH:-roi_config.json}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000/api/v1}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PUSH_INTERVAL_SECONDS: ${PUSH_INTERVAL_SECONDS:-2}
      CAMERA_COUNTER_ID: ${CAMERA_COUNTER_ID:-}
      FRAME_SKIP: ${FRAME_SKIP:-1}
      MIN_DETECTION_AREA: ${MIN_DETECTION_AREA:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

volumes:
  pgdata:
