services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiqms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiqms}
      POSTGRES_DB: ${POSTGRES_DB:-aiqms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiqms} -d ${POSTGRES_DB:-aiqms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aiqms:aiqms@db:5432/aiqms}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  whatsapp-bot:
    build: ./whatsapp-bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      PHONE_NUMBER_ID: ${PHONE_NUMBER_ID}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v20.0}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000/api/v1}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  pgdata:
