[alembic]
script_location = migrations
prepend_sys_path = .
# Placeholder for Phase 0 — env.py does not exist yet. Wired to app settings
# (app.config.Settings.DATABASE_URL) when migrations are implemented in Phase 3.
sqlalchemy.url = postgresql+psycopg://aiqms:aiqms@localhost:5432/aiqms

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
