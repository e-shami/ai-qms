name: CV (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cv-service/requirements.txt
      - run: pip install -r requirements.txt ruff mypy pytest
      - run: ruff check .
      - run: mypy . --ignore-missing-imports
      - name: Run tests if present
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pytest -v
          else
            echo "No CV tests exist yet."
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./cv-service
          push: false
