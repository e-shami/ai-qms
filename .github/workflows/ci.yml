name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    name: Check Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite://
      SECRET_KEY: ci-only-not-a-production-secret
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/ml-notebooks:${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt httpx httpx2
      - run: python -m compileall -q app migrations tests ../ml-notebooks/pipeline
      - run: python -m unittest discover -s tests -v

  migrations:
    name: Check PostgreSQL Migrations
    runs-on: ubuntu-latest
    container: python:3.12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:disposable-test-only@aiqms-intake-postgres:5432/postgres
      SECRET_KEY: ci-only-not-a-production-secret
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/ml-notebooks:${{ github.workspace }}/backend
    services:
      aiqms-intake-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic downgrade base
      - name: PostgreSQL intake and concurrency regressions
        # This test requires /workspace and the disposable service hostname above.
        run: |
          ln -s "$GITHUB_WORKSPACE/backend" /workspace
          python tests/postgres_intake_check.py

  frontend:
    name: Check Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Next generates route types before its built-in TypeScript check.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      - name: Frontend regression tests
        run: npx --yes tsx@4.20.6 --test tests/*.test.tsx

  whatsapp-bot:
    name: Check WhatsApp Bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: whatsapp-bot/package-lock.json
      - run: npm ci
      # ESLint is not configured in this package; do not report lint as passed.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  build-docker-images:
    name: Build Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test-backend, migrations, frontend, whatsapp-bot]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, whatsapp-bot]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
